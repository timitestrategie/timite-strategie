name: Mise à jour des pages du site

# Chaque jour, et à la demande (onglet Actions > Run workflow), les pages HTML
# sont régénérées à partir du Google Sheet.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "app.js"
      - "style.css"
      - "template.html"
      - "build_static.py"

permissions:
  contents: write

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer le navigateur de génération
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Générer les pages
        run: python build_static.py
      - name: Enregistrer les changements
        run: |
          git config user.name "Mise à jour automatique"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Mise à jour des pages depuis le Google Sheet"
          git push
